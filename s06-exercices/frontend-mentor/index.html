<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Profile card component</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <!-- La police Kumbh Sans (style-guide.md) : graisses 400 et 700 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Une carte = un contenu autonome : article -->
    <article class="card">
      <!-- width et height évitent un saut de la page au chargement -->
      <img class="card-photo" src="./images/image-victor.jpg" alt="Victor Crest" width="96" height="96">

      <!-- Un seul titre h1 ; l'âge est dans un span pour le styler à part -->
      <h1 class="card-name">Victor Crest <span class="card-age">26</span></h1>
      <p class="card-city">London</p>

      <!-- Trois chiffres de même nature : une liste -->
      <ul class="card-stats">
        <li><strong>80K</strong> Followers</li>
        <li><strong>803K</strong> Likes</li>
        <li><strong>1.4K</strong> Photos</li>
      </ul>
    </article>
  </main>
</body>
</html>
