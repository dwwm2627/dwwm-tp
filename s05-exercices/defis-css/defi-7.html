<!doctype html>
<!-- Défi CSS 7 : reproduisez cible-7.png (400 x 300 pixels), en HTML et CSS uniquement.
     Indice : Flexbox en colonne sur le body (flex-direction: column) ; la bande du milieu prend toute la place restante (flex: 1). -->
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Défi CSS 7</title>
    <style>
      body { 
        margin: 0; 
        width: 400px; 
        height: 300px; 
        display: flex;
        flex-direction: column;
      }
      .haut{
        background: #b3122e;
        height:60px;
      }
      .milieu{
        background: #f4f1ea;
        flex:1;
      }
      .bas{
        background: #1f2a5a;
        height: 60px;
      }
    
    </style>
  </head>
  <body>
    <div class="haut"></div>
    <div class="milieu"></div>
    <div class="bas"></div>
  </body>
</html>
