<!doctype html>
<!-- Défi CSS 2 : reproduisez cible-2.png (400 x 300 pixels), en HTML et CSS uniquement.
     Indice : position: relative sur le body, puis position: absolute avec left / top / bottom sur chaque forme. -->
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Défi CSS 2</title>
    <style>
      body { 
        margin: 0; 
        width: 400px; 
        height: 300px; 
        background: #f4f1ea;
        position: relative;
      }

      .cercle{
        background: #b3122e;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        position: absolute;
        left: 40px;
        top: 40px;
      }

      .barre{
        background: #1f2a5a;
        width: 200px;
        height: 40px;
        position: absolute;
        left: 100px;
        bottom: 40px;
      }
    
    
    </style>
  </head>
  <body>
    <div class="cercle"></div>
    <div class="barre"></div>
  </body>
</html>
