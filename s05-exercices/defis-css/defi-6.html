<!doctype html>
<!-- Défi CSS 6 : reproduisez cible-6.png (400 x 300 pixels), en HTML et CSS uniquement.
     Indice : une grille de 4 colonnes sur le body (grid-template-columns), douze cases, et deux classes pour les deux couleurs. -->
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Défi CSS 6</title>
    <style>
      body { 
        margin: 0; 
        width: 400px; 
        height: 300px; 
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }
      .fonce{
        background: #1f2a5a;
      }
      .clair{
        background: #f4f1ea;
      }
    </style>
  </head>
  <body>
    <div class="fonce"></div>
    <div class="clair"></div>
    <div class="fonce"></div>
    <div class="clair"></div>
    <div class="clair"></div>
    <div class="fonce"></div>
    <div class="clair"></div>
    <div class="fonce"></div>
    <div class="fonce"></div>
    <div class="clair"></div>
    <div class="fonce"></div>
    <div class="clair"></div>
  </body>
</html>
