<!doctype html>
<!-- Défi CSS 5 : reproduisez cible-5.png (400 x 300 pixels), en HTML et CSS uniquement.

<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Défi CSS 5</title>
    <style>
      body { 
        margin: 0; 
        width: 400px;

        display: flex;
        justify-content: space-evenly;
        align-items: center;
      }
      .pastille{
        background: #1f2a5aea;
        width: 50px;
        height: 50px;
        border-radius: 50%;
      }

  </head>
  <body>

    <div class="pastille"></div>

    <div class="pastille"></div>

</html>
