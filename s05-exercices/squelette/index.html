<!DOCTYPE html> <!--HTML actuel (HTML5), c'est toujours la premiere ligne d'un document HTML-->
<html lang="fr"> <!--La langue du contenu, par defaut EMMET met toujours "en"-->


<head> <!--Les informations sur la page : rien ne s'affiche dans la page-->
    <meta charset="UTF-8"> <!--L'encodage du fichier : il permet de lire les accents-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--La page prend la largeur de l'ecran, pas celle de l'rodinateur-->
    <title>Mon premier squelette</title> <!--Le texte de l'onglet et des resultats de recherche-->
</head> <!--Fin du bloc d'informations-->




<body><!--Tout ce qui s'affiche dans la page-->
    <h1>Bonjour à tous, ça marche !</h1> <!-- Le titre principal, avec un accent pour le test de l'étape 4. -->
    <p>Les accents : é è à ç œ €</p><!--Une ligne faite pour voir si l'encodage est bon-->
    
</body><!--Fin du contenu visible-->
</html><!--Fin du document-->
