<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<main>
    <h1>Qui gagne ?</h1>
    <p id="message" class="note">Ce texte est vise par trois regles</p><!--Un id, une classe, un balise p : les trois sont le viser-->
    <p class="rappel">Ce texte est vise deux fois par la meme classe</p><!--Pour le cas d egalite-->
    <section class="boite"><!--Le parent pour l'heritage-->
        <p>Je suis l'enfant de la boite</p><!--L'enfant : aucune regle ne le vise directement-->
    </section>
</main>



</body>
</html>
