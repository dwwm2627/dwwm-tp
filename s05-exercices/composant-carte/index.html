<!doctype html>
<!-- Carte de profil : reproduisez cible-mobile.png et cible-bureau.png.
     Le contenu est fourni : écrivez la structure HTML sémantique, puis le CSS dans style.css. -->
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carte de profil</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Contenu à mettre en forme :
         image avatar.svg (texte alternatif : « Avatar illustré de Sam »)
         Sam Martin
         Développeuse front-end
         HTML — CSS — JavaScript
         Voir le portfolio (un lien) -->
         <article class="profil">
            <img class="profil_avatar" src="avatar.svg" alt="Avatar illustre de Sam" width="96" height="96">
            <h2 class="profil_nom">Sam Martin</h2>
            <p class="profil_role">Developpeuse Front-end</p>
            <ul class="profil_competences">
              <li>HTML</li>
              <li>CSS</li>
              <li>Javascript</li>
            </ul>
            <a href="#portfolio" class="profil_bouton">Voir le portfolio</a>
         </article> 
  </body>
</html>
