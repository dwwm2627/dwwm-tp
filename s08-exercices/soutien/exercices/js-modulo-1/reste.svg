  <circle cx="86" cy="115" r="14" fill="#1f5fbf"/>
  <circle cx="124" cy="115" r="14" fill="#1f5fbf"/>
  <circle cx="162" cy="115" r="14" fill="#1f5fbf"/>
  <text x="105" y="190" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1c1e21">groupe 1</text>
  <rect x="210" y="70" width="170" height="90" rx="14" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="3"/>
  <circle cx="238" cy="115" r="14" fill="#1f5fbf"/>
  <circle cx="276" cy="115" r="14" fill="#1f5fbf"/>
  <circle cx="314" cy="115" r="14" fill="#1f5fbf"/>
  <circle cx="352" cy="115" r="14" fill="#1f5fbf"/>
  <text x="295" y="190" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1c1e21">groupe 2</text>
  <rect x="400" y="70" width="170" height="90" rx="14" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="3"/>
  <circle cx="428" cy="115" r="14" fill="#1f5fbf"/>
