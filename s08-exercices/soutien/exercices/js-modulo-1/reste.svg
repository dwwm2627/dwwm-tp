  <circle cx="504" cy="115" r="14" fill="#1f5fbf"/>
  <circle cx="542" cy="115" r="14" fill="#1f5fbf"/>
  <text x="485" y="190" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1c1e21">groupe 3</text>
  <rect x="590" y="70" width="140" height="90" rx="14" fill="#fdecea" stroke="#8a1c1c" stroke-width="3" stroke-dasharray="8 6"/>
