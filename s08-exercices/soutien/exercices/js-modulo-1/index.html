<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Le reste de la division</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Le reste de la division</h1>
      <h2>1. Des groupes de 4</h2>
      <p id="groupes" class="resultat"></p>
      <h2>2. Pair ou impair</h2>
      <p id="pair" class="resultat"></p>
      <h2>3. Une ligne sur deux</h2>
      <ul id="liste" class="liste"></ul>
      <h2>4. L'horloge</h2>
      <label for="heure">Une heure, de 0 à 23</label>
      <input id="heure" type="number" min="0" max="23" value="15">
      <p id="horloge" class="resultat"></p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
