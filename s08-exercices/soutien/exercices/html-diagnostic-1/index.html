<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
  </head>
  <body>
    <div class="haut">
      <img src="logo.svg">
      <div class="liens">
        <a href="#horaires">Horaires</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
    <div class="contenu">
      <h1>Atelier vélo</h1>
      <p>Réparez votre vélo vous-même, avec nos outils et nos conseils.</p>
      <h1 id="horaires">Horaires</h1>
      <p>Le samedi, de 10 h à 17 h.</p>
      <h1 id="contact">Contact</h1>
      <form>
        <input type="text" name="nom" placeholder="Votre nom">
        <input type="email" name="email" placeholder="Votre adresse e-mail">
        <button type="submit">Envoyer</button>
      </form>
    </div>
    <div class="bas">
      <p>Atelier vélo associatif</p>
    </div>
  </body>
</html>
